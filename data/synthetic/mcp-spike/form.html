<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidatura fictícia de demonstração</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; color: #17202a; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input, textarea { box-sizing: border-box; width: 100%; padding: .6rem; font: inherit; }
    textarea { min-height: 8rem; }
  </style>
</head>
<body>
  <main>
    <h1>Candidatura fictícia de demonstração</h1>
    <p>Este formulário é apenas um experimento. Não há envio de candidatura.</p>
    <label for="fullName">Nome completo</label>
    <input id="fullName" name="fullName" autocomplete="off">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="off">
    <label for="targetRole">Cargo pretendido</label>
    <input id="targetRole" name="targetRole" autocomplete="off">
    <label for="approvedAnswer">Resposta profissional</label>
    <textarea id="approvedAnswer" name="approvedAnswer"></textarea>
  </main>
</body>
</html>
