[project]
name = "resume-builder"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend/core", "backend/api", "backend/worker", "backend/mcp_server"]

[tool.uv.sources]
resume-core = { workspace = true }

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
