name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.18.0
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.12.7
          python-version: 3.14.8
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          cargo install just --version 1.57.0 --locked
          corepack enable
          corepack prepare pnpm@11.28.9 --activate
      - name: Install locked dependencies
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install chromium --with-deps
      - name: Verify Docker
        run: docker info
      - name: Run gates
        run: just check
